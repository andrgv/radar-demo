[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "glass-radar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "PyQt6>=6.6,<7", "matplotlib>=3.8,<4", "pyserial>=3.5,<4"]

[project.optional-dependencies]
material = ["xgboost>=2.1,<4"]

[project.scripts]
glass-radar = "radar.cli:main"

[tool.setuptools]
packages = ["radar", "radar_min"]
